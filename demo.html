<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>passes · creator copilot demo</title>
<meta name="description" content="Single-file demo of the Passes creator dashboard AI copilot.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Passes Creator Dashboard — brand-accurate styles
   Palette: Powder Blue scale (only approved hex values).
   80/20 rule: ~80% dark monochromatic foundation, ~20% Powder Blue.
   Typeface: Poppins for display/wordmark, Inter for body.
   ============================================================ */

:root {
  /* Powder Blue scale — approved hex, do not approximate */
  --pb-25:  #F5FEFF;
  --pb-50:  #ECFDFF;
  --pb-100: #CFF9FE;
  --pb-200: #A5F0FC;
  --pb-300: #67E3F9;
  --pb-400: #22CCEE;
  --pb-500: #06AED4;
  --pb-600: #088AB2;
  --pb-700: #0E7090;
  --pb-800: #155B75;
  --pb-900: #164C63;
  --pb-950: #0D2D3A;

  /* Dark monochromatic foundation (neutral, cool-tinted toward the blue) */
  --bg-0:   #0A0F12;   /* app background */
  --bg-1:   #0F161A;   /* raised surface */
  --bg-2:   #141D22;   /* cards */
  --bg-3:   #1B262C;   /* inputs / hover */
  --bg-4:   #24343C;   /* borders emphasis */
  --line:   #212E35;   /* hairline borders */

  --text-0: #EAF3F6;   /* primary text */
  --text-1: #A7BAC2;   /* secondary */
  --text-2: #6E828C;   /* muted */

  --accent:      var(--pb-400);
  --accent-deep: var(--pb-600);
  --accent-soft: rgba(34, 204, 238, 0.12);

  --good: #3ddc97;
  --warn: #f5b342;
  --bad:  #F0616D;

  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 12px 40px rgba(0,0,0,.45);
  --shadow-sm: 0 4px 16px rgba(0,0,0,.30);

  --font-display: "Poppins", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;

  --nav-h: 60px;
  --copilot-w: 380px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-0);
  color: var(--text-0);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* subtle powder-blue aura in the background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(8,138,178,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(14,112,144,.10), transparent 55%);
  pointer-events: none;
}

/* ===================== TOP BAR ===================== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: rgba(10,15,18,.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar__left { display: flex; align-items: center; gap: 26px; }
.wordmark { display: flex; align-items: center; gap: 9px; }
.wordmark__mark { display: grid; place-items: center; }
.wordmark__text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -.5px;
  color: var(--text-0);
}
.mainnav { display: flex; gap: 4px; }
.mainnav__item {
  padding: 8px 12px;
  border-radius: 8px;
  color: var(--text-1);
  font-weight: 500;
  font-size: 14px;
  transition: background .15s, color .15s;
}
.mainnav__item:hover { color: var(--text-0); background: var(--bg-2); }
.mainnav__item.is-active { color: var(--pb-200); }
.topbar__right { display: flex; align-items: center; gap: 14px; }
.iconbtn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-1);
  width: 36px; height: 36px;
  border-radius: 9px;
  font-size: 16px;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.iconbtn:hover { background: var(--bg-2); color: var(--text-0); }
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 600; font-size: 13px;
  color: var(--bg-0);
  background: linear-gradient(135deg, var(--pb-300), var(--pb-600));
}

/* ===================== LAYOUT ===================== */
.layout {
  display: grid;
  grid-template-columns: 1fr var(--copilot-w);
  gap: 0;
  align-items: start;
  min-height: calc(100vh - var(--nav-h));
}
.main {
  padding: 28px 32px 80px;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
}

.pagehead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.pagehead__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: -.6px;
  margin: 0;
}
.pagehead__sub { margin: 4px 0 0; color: var(--text-1); }
#openChatMobile { display: none; }

/* ===================== STATS ===================== */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 26px;
}
.stat {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  position: relative;
  overflow: hidden;
}
.stat__label { color: var(--text-2); font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
.stat__value { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 6px 0 2px; letter-spacing: -.5px; }
.stat__delta { font-size: 12.5px; font-weight: 600; }
.stat__delta.up { color: var(--good); }
.stat__delta.down { color: #f0616d; }
.stat__spark { position: absolute; right: 12px; bottom: 10px; opacity: .5; }

/* ===================== TABS ===================== */
.tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}
.tab {
  background: transparent;
  border: none;
  color: var(--text-1);
  font-weight: 500;
  font-size: 14.5px;
  padding: 10px 14px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--text-0); }
.tab.is-active { color: var(--pb-200); border-bottom-color: var(--pb-400); }

.tabpanel { display: none; animation: fade .25s ease; }
.tabpanel.is-active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ===================== CARDS / GENERIC ===================== */
.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
}
.card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card__title { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0; }
.card__sub { color: var(--text-1); font-size: 13px; margin: 2px 0 0; }
.section-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 22px 0 12px; color: var(--text-0); }

.btn {
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 9px 15px;
  font-weight: 600;
  font-size: 13.5px;
  transition: transform .08s, background .15s, border-color .15s, opacity .15s;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--pb-400); color: #062731; }
.btn--primary:hover { background: var(--pb-300); }
.btn--ghost { background: transparent; border-color: var(--bg-4); color: var(--text-0); }
.btn--ghost:hover { background: var(--bg-3); }
.btn--sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
.btn--danger { background: transparent; border-color: #5a2a30; color: #f0616d; }
.btn--danger:hover { background: rgba(240,97,109,.10); }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600;
  background: var(--bg-3); color: var(--text-1);
  border: 1px solid var(--line);
}
.pill--post { color: var(--pb-200); border-color: var(--pb-800); background: rgba(8,138,178,.12); }
.pill--dm { color: #d6b8ff; border-color: #40306b; background: rgba(120,80,200,.14); }
.pill--live { color: var(--good); border-color: #1f5a44; background: rgba(61,220,151,.12); }
.pill--active { color: var(--good); border-color: #1f5a44; background: rgba(61,220,151,.12); }
.pill--paused { color: var(--warn); border-color: #5a4520; background: rgba(245,179,66,.12); }
.pill--draft { color: var(--text-1); }

.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.right { margin-left: auto; }
.row { display: flex; align-items: center; gap: 10px; }
.row--wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.spacer { flex: 1; }

/* ===================== OVERVIEW ===================== */
.overview-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.actionlist { display: flex; flex-direction: column; gap: 10px; }
.action-tip {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 12px 13px;
}
.action-tip__icon {
  flex: 0 0 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center; font-size: 16px;
  background: var(--accent-soft); color: var(--pb-200);
}
.action-tip__body { flex: 1; }
.action-tip__title { font-weight: 600; font-size: 14px; }
.action-tip__desc { color: var(--text-1); font-size: 13px; margin-top: 2px; }

/* heatmap */
.heatmap { display: grid; gap: 3px; }
.heatmap__row { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 3px; align-items: center; }
.heatmap__day { font-size: 11px; color: var(--text-2); }
.heat {
  aspect-ratio: 1 / 1; border-radius: 3px;
  background: var(--bg-3); position: relative;
}
.heat[data-best="1"] { outline: 1.5px solid var(--pb-300); outline-offset: -1px; }
.heatmap__legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--text-2); font-size: 12px; }
.heatmap__scale { display: flex; gap: 2px; }
.heatmap__scale span { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.heatmap__hours { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 3px; margin-top: 4px; }
.heatmap__hours span { font-size: 9px; color: var(--text-2); text-align: center; }

/* ===================== QUEUE (scheduler) ===================== */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button {
  background: transparent; border: none; color: var(--text-1);
  padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13px;
}
.seg button.is-active { background: var(--bg-3); color: var(--pb-200); }

.queue { display: flex; flex-direction: column; gap: 10px; }
.qitem {
  display: grid;
  grid-template-columns: 92px 1fr auto;
  gap: 14px;
  align-items: center;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-color .15s;
}
.qitem:hover { border-color: var(--bg-4); }
.qitem__when { text-align: center; }
.qitem__day { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.qitem__mon { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; }
.qitem__time { font-size: 12.5px; color: var(--pb-200); margin-top: 2px; font-weight: 600; }
.qitem__body { min-width: 0; }
.qitem__meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
.qitem__text { color: var(--text-0); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.qitem__sub { color: var(--text-2); font-size: 12.5px; margin-top: 4px; }
.qitem__actions { display: flex; gap: 6px; flex-shrink: 0; }
.empty {
  text-align: center; color: var(--text-2);
  padding: 40px 20px; border: 1px dashed var(--line); border-radius: var(--radius);
}

/* ===================== AUTOMATIONS ===================== */
.autolist { display: flex; flex-direction: column; gap: 10px; }
.auto {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px 16px;
  display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center;
  transition: border-color .15s;
}
.auto:hover { border-color: var(--bg-4); }
.auto__icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: var(--accent-soft); }
.auto__name { font-weight: 600; font-size: 14.5px; }
.auto__trig { color: var(--text-1); font-size: 12.5px; margin-top: 2px; }
.auto__stat { color: var(--text-2); font-size: 12px; margin-top: 4px; }
.auto__right { display: flex; align-items: center; gap: 10px; }

/* flow builder */
.flow { display: flex; flex-direction: column; gap: 0; }
.flow__node {
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 13px 15px;
  position: relative;
}
.flow__node--trigger { border-color: var(--pb-800); background: rgba(8,138,178,.08); }
.flow__node--cond { border-color: #5a4520; background: rgba(245,179,66,.06); }
.flow__nodetop { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.flow__kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-2); }
.flow__body { font-size: 13.5px; color: var(--text-0); }
.flow__delay { color: var(--pb-200); font-size: 12px; font-weight: 600; }
.flow__connector { height: 22px; width: 2px; background: var(--bg-4); margin: 0 auto; }
.flow__connector-label {
  text-align: center; margin: 4px auto; font-size: 11px; color: var(--text-2);
}

/* toggle switch */
.switch { position: relative; width: 40px; height: 22px; flex: 0 0 40px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch__track {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--bg-4); transition: background .18s;
}
.switch__track::before {
  content: ""; position: absolute; left: 3px; top: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-1); transition: transform .18s, background .18s;
}
.switch input:checked + .switch__track { background: var(--pb-500); }
.switch input:checked + .switch__track::before { transform: translateX(18px); background: #04222b; }

/* ===================== COPILOT ===================== */
.copilot {
  position: sticky;
  top: var(--nav-h);
  height: calc(100vh - var(--nav-h));
  width: var(--copilot-w);
  display: flex;
  flex-direction: column;
  background: var(--bg-1);
  border-left: 1px solid var(--line);
}
.copilot.is-collapsed { display: none; }
.copilot__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.copilot__id { display: flex; align-items: center; gap: 11px; }
.copilot__dot {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--pb-300), var(--pb-700));
  display: grid; place-items: center; flex-shrink: 0;
  box-shadow: 0 0 0 4px rgba(34,204,238,.10);
}
.copilot__dot::after { content: "✦"; color: #04222b; font-size: 15px; }
.copilot__name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.copilot__status { font-size: 11.5px; color: var(--pb-200); }

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.msg { display: flex; gap: 9px; max-width: 100%; animation: msgIn .22s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg__avatar {
  flex: 0 0 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center; font-size: 12px;
}
.msg--bot .msg__avatar { background: linear-gradient(135deg, var(--pb-300), var(--pb-700)); color: #04222b; }
.msg--user { flex-direction: row-reverse; }
.msg--user .msg__avatar { background: var(--bg-4); color: var(--text-0); }
.msg__bubble {
  padding: 10px 13px; border-radius: 13px; font-size: 14px; line-height: 1.55;
  max-width: 280px;
}
.msg--bot .msg__bubble { background: var(--bg-3); border-top-left-radius: 4px; }
.msg--user .msg__bubble { background: var(--pb-600); color: #04222b; border-top-right-radius: 4px; font-weight: 500; }
.msg__bubble p { margin: 0 0 7px; }
.msg__bubble p:last-child { margin-bottom: 0; }
.msg__bubble strong { color: var(--pb-100); }
.msg--user .msg__bubble strong { color: #04222b; }
.msg__bubble ul { margin: 6px 0; padding-left: 18px; }
.msg__bubble code { background: rgba(0,0,0,.25); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }

/* typing indicator */
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-2); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

/* action card inside chat */
.actioncard {
  margin-top: 4px;
  background: var(--bg-2);
  border: 1px solid var(--pb-800);
  border-radius: 12px;
  overflow: hidden;
}
.actioncard__head {
  padding: 9px 12px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px; color: var(--pb-200);
  background: rgba(8,138,178,.12); border-bottom: 1px solid var(--pb-900);
  display: flex; align-items: center; gap: 6px;
}
.actioncard__body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; gap: 8px; font-size: 13px; }
.kv__k { color: var(--text-2); flex: 0 0 84px; }
.kv__v { color: var(--text-0); font-weight: 500; }
.actioncard__foot { padding: 0 12px 12px; display: flex; gap: 8px; }
.actioncard.is-done .actioncard__foot { display: none; }
.actioncard__done { padding: 10px 12px; color: var(--good); font-size: 12.5px; font-weight: 600; border-top: 1px solid var(--line); display: none; }
.actioncard.is-done .actioncard__done { display: block; }

.chat__suggest {
  display: flex; gap: 7px; padding: 10px 14px 4px; flex-wrap: wrap;
  border-top: 1px solid var(--line);
}
.chip {
  background: var(--bg-2); border: 1px solid var(--bg-4); color: var(--text-1);
  padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { background: var(--bg-3); color: var(--pb-200); border-color: var(--pb-700); }

.composer { display: flex; gap: 8px; padding: 12px 14px 16px; }
.composer__input {
  flex: 1;
  background: var(--bg-2);
  border: 1px solid var(--bg-4);
  color: var(--text-0);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}
.composer__input:focus { border-color: var(--pb-600); }
.composer__input::placeholder { color: var(--text-2); }
.composer__send {
  flex: 0 0 44px; height: 44px; border-radius: 12px; border: none;
  background: var(--pb-400); color: #04222b; font-size: 18px; font-weight: 700;
  transition: background .15s, transform .08s;
}
.composer__send:hover { background: var(--pb-300); }
.composer__send:active { transform: scale(.94); }

/* FAB */
.fab {
  position: fixed; right: 22px; bottom: 22px; z-index: 60;
  background: var(--pb-400); color: #04222b;
  border: none; border-radius: 999px; padding: 13px 20px;
  font-weight: 700; font-size: 14px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 7px;
}
.fab:hover { background: var(--pb-300); }

/* ===================== MODAL ===================== */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }
.modal[hidden] { display: none; }
.modal__backdrop { position: absolute; inset: 0; background: rgba(4,8,10,.66); backdrop-filter: blur(3px); }
.modal__card {
  position: relative; z-index: 1;
  width: min(560px, 92vw); max-height: 88vh; overflow-y: auto;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow); padding: 22px;
}
.modal__title { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.modal__sub { color: var(--text-1); margin: 0 0 18px; font-size: 13.5px; }

/* ============================================================
   data.js — mock data + shared state for the prototype

(function () {
  "use strict";

  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  /* --- Engagement heatmap ---------------------------------
     engagement[dayIndex][hour] = 0..100 relative activity.
     Built with a deterministic model so "best times" are stable:
     weekday evenings (7-10pm) + lunch (12-1pm) peak, weekends shift later.
  --------------------------------------------------------- */
  function buildEngagement() {
    var grid = [];
    for (var d = 0; d < 7; d++) {
      var row = [];
      var weekend = d === 0 || d === 6;
      for (var h = 0; h < 24; h++) {
        var v = 6; // baseline
        // morning bump
        v += bump(h, weekend ? 10 : 8, 2, weekend ? 22 : 26);
        // lunch bump (weekdays stronger)
        v += bump(h, 12.5, 1.4, weekend ? 20 : 40);
        // evening prime time
        v += bump(h, weekend ? 21.5 : 20.5, 2.2, weekend ? 78 : 92);
        // late night tail
        v += bump(h, 24.5, 2.5, 30);
        // slight per-day variance (deterministic)
        v *= 0.9 + 0.03 * ((d * 7 + 3) % 6);
        row.push(Math.max(2, Math.min(100, Math.round(v))));
      }
      grid.push(row);
    }
    return grid;
  }
  function bump(h, center, width, height) {
    var x = (h - center) / width;
    return height * Math.exp(-0.5 * x * x);
  }

  var engagement = buildEngagement();

  /* Best posting windows, sorted by score (top 6). */
  function bestWindows(limit) {
    var flat = [];
    for (var d = 0; d < 7; d++) {
      for (var h = 0; h < 24; h++) {
        flat.push({ day: d, hour: h, score: engagement[d][h] });
      }
    }
    flat.sort(function (a, b) { return b.score - a.score; });
    return flat.slice(0, limit || 6);
  }

  /* Best window on a specific weekday index. */
  function bestHourForDay(dayIndex) {
    var row = engagement[dayIndex];
    var best = 0, bh = 20;
    for (var h = 6; h < 24; h++) {
      if (row[h] > best) { best = row[h]; bh = h; }

    return { hour: bh, score: best };

    { id: "tier_upgrade", group: "Lifecycle", icon: "⭐", name: "Upgraded tier", desc: "A fan moves to a higher tier." },
    { id: "tier_downgrade", group: "Lifecycle", icon: "↘️", name: "Downgraded tier", desc: "A fan moves to a lower tier." },
    // Revenue
    { id: "first_purchase", group: "Revenue", icon: "🛍️", name: "First purchase", desc: "A fan's first paid unlock." },

    // Engagement
    { id: "no_reply", group: "Engagement", icon: "💬", name: "No reply in 48h", desc: "A fan hasn't replied recently." },
    { id: "inactive_7", group: "Engagement", icon: "😴", name: "Inactive 7 days", desc: "A fan has gone quiet for a week." },
    { id: "inactive_30", group: "Engagement", icon: "🌙", name: "Inactive 30 days", desc: "A fan has gone quiet for a month." },
    { id: "birthday", group: "Engagement", icon: "🎂", name: "Fan birthday", desc: "It's a fan's birthday." },
    { id: "welcome_back", group: "Engagement", icon: "🎉", name: "Win-back / resubscribe", desc: "A lapsed fan comes back." },
    { id: "livestream", group: "Engagement", icon: "📺", name: "Before livestream", desc: "You're about to go live." },
    { id: "keyword", group: "Engagement", icon: "🔎", name: "Keyword in message", desc: "A fan messages a keyword you set." },
    { id: "post_like", group: "Engagement", icon: "❤️", name: "Liked a post", desc: "A fan likes one of your posts." }
  ];

  function triggerById(id) {
    for (var i = 0; i < triggers.length; i++) if (triggers[i].id === id) return triggers[i];
    return null;
  }

  /* --- Seed: scheduled queue ------------------------------ */
  // times are stored as JS Date; kept relative to "now" so the demo always looks live.
  function daysFromNow(n, hour, min) {

  }

  var queue = [
    {
      id: uid(), kind: "post", status: "scheduled",

    },

    },

      when: daysFromNow(3, 12, 30),
      text: "lunch break Q&A 🍜 drop your questions below and I'll answer my faves tonight.",
      audience: "all", price: 0, source: "smart",
      smart: { time: true, caption: true, price: false }

  /* --- Seed: automation flows ----------------------------- */
  var automations = [
    {
      id: uid(),
      name: "Welcome new subscribers",

      sent: 214, conv: "31%",
      steps: [

      ]
    },
    {

        { type: "delay", delay: 4320 },
        { type: "message", delay: 0, price: 0, text: "ok here's the deal: resubscribe this week and your first month is 40% off. link's in your inbox 💌" }
      ]
    },
    {
      id: uid(),
      name: "Unfollows You",
      trigger: "unfollow",
      status: "paused",
      sent: 129, conv: "9%",
      steps: [
        { type: "message", delay: 0, text: "aw you're heading out 😢 no hard feelings. if it was the price, reply 'stay' for something special." },
        { type: "condition", delay: 0, cond: "replied_stay", label: "If they reply 'stay'" },
        { type: "message", delay: 0, price: 0, text: "you said the magic word ✨ here's 50% off to keep you around. we're not done yet 💪" }
      ]
    }
  ];

  /* --- utilities ------------------------------------------ */
  function uid() {
    // deterministic-ish unique id without Date.now/Math.random (blocked in some envs)
    uid._c = (uid._c || 0) + 1;
    return "id_" + uid._c + "_" + (uid._c * 2654435761 % 100000).toString(36);
  }

  function fmtHour(h) {
    var ap = h < 12 || h === 24 ? "am" : "pm";
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ap;
  }
  function fmtHourMin(d) {
    var h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? "AM" : "PM";
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ":" + (m < 10 ? "0" + m : m) + " " + ap;
  }
  function fmtDelay(mins) {
    if (mins <= 0) return "immediately";
    if (mins < 60) return "wait " + mins + " min";
    if (mins < 1440) { var h = Math.round(mins / 60); return "wait " + h + " hour" + (h > 1 ? "s" : ""); }
    var d = Math.round(mins / 1440); return "wait " + d + " day" + (d > 1 ? "s" : "");
  }

  window.PassesData = {
    DAYS: DAYS,
    engagement: engagement,
    bestWindows: bestWindows,
    bestHourForDay: bestHourForDay,
    segments: segments,
    stats: stats,
    triggers: triggers,
    triggerById: triggerById,
    queue: queue,
    automations: automations,
    uid: uid,

    fmtHour: fmtHour,
    fmtHourMin: fmtHourMin,
    fmtDelay: fmtDelay
  };
