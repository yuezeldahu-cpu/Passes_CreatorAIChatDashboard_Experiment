<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>passes · creator copilot demo</title>
<meta name="description" content="Single-file demo of the Passes creator dashboard AI copilot.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Passes Creator Dashboard — light-first, with a dark toggle.
   Light default matches the real product; Powder Blue accents.
   Theme model:
     :root                         -> light palette (default)
     @media (prefers-color-scheme: dark) :root:not([data-theme=light])
     :root[data-theme=dark]        -> dark (toggle wins both ways)
   All components read tokens, never raw theme literals.
   ============================================================ */

:root {
  /* Powder Blue scale (approved values) */
  --pb-25:#F5FEFF; --pb-50:#ECFDFF; --pb-100:#CFF9FE; --pb-200:#A5F0FC;
  --pb-300:#67E3F9; --pb-400:#22CCEE; --pb-500:#06AED4; --pb-600:#088AB2;
  --pb-700:#0E7090; --pb-800:#155B75; --pb-900:#164C63; --pb-950:#0D2D3A;

  /* --- LIGHT palette (mapped from Passes Light mode tokens) --- */
  --app:      #F8FAFF;   /* bg-secondary */
  --surface:  #FFFFFF;   /* bg-primary */
  --surface-2:#FFFFFF;
  --raise:    #FDFDFF;   /* bg-secondary-subtle */
  --hover:    #F3F4FA;   /* bg-tertiary */
  --border:   #E8E9EF;   /* border-secondary */
  --border-2: #D4D6DF;   /* border-primary */
  --line:     #F3F4FA;   /* border-tertiary */

  --ink-0: #1B1D23;      /* text-primary */
  --ink-1: #43464F;      /* text-secondary */
  --ink-2: #737581;      /* text-quaternary / placeholder */

  --accent:      #06AED4;   /* brand-500 */
  --accent-deep: #0E7090;   /* brand-700 */
  --accent-text: #0E7090;   /* text-brand-secondary (on light) */
  --accent-soft: #ECFDFF;   /* bg-brand-primary */
  --brand-solid:       #088AB2;  /* bg-brand-solid */
  --brand-solid-hover: #0E7090;  /* bg-brand-solid-hover */
  --on-brand-solid:    #FFFFFF;  /* text-primary-on-brand */
  --ink-on-accent-deep:#FFFFFF;  /* text on deep-accent bubble */

  --good:#067647; --good-soft:#ECFDF3; --good-bd:#ABEFC6;   /* success */
  --warn:#B54708; --warn-soft:#FFFAEB; --warn-bd:#FEDF89;   /* warning */
  --bad:#D92D20;  --bad-soft:#FEF3F2;  --bad-bd:#FDA29B;    /* error */

  --post-text:#0E7090; --post-bg:#ECFDFF; --post-bd:#A5F0FC;
  --dm-text:#6B3FB0;   --dm-bg:#F2ECFD;  --dm-bd:#DDD0F5;

  --create-bg:#0B0C12; --create-text:#FFFFFF;  /* bg-primary-solid */

  --radius:16px; --radius-sm:11px;
  --shadow:    0 10px 30px rgba(20,30,40,.10);
  --shadow-sm: 0 2px 10px rgba(20,30,40,.06);
  --ring: 0 0 0 3px rgba(6,174,212,.28);

  --font-display:"Poppins", system-ui, sans-serif;
  --font-body:"Inter", system-ui, -apple-system, sans-serif;

  --side-w: 250px;
  --side-w-collapsed: 76px;
  --copilot-w: 380px;
}

/* --- DARK palette (mapped from Passes Dark mode tokens) --- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --app:#0B0C12; --surface:#1B1D23; --surface-2:#1B1D23; --raise:#1B1D23;
    --hover:#292A31; --border:#292A31; --border-2:#43464F; --line:#292A31;
    --ink-0:#F8FAFF; --ink-1:#D4D6DF; --ink-2:#A4A7B3;
    --accent:#06AED4; --accent-deep:#67E3F9; --accent-text:#A5F0FC; --accent-soft:rgba(6,174,212,.16);
    --brand-solid:#088AB2; --brand-solid-hover:#06AED4; --on-brand-solid:#F8FAFF;
    --ink-on-accent-deep:#04222b;
    --good:#47CD89; --good-soft:rgba(23,178,106,.16); --good-bd:#085D3A;
    --warn:#FDB022; --warn-soft:rgba(247,144,9,.16); --warn-bd:#93370D;
    --bad:#F97066;  --bad-soft:rgba(240,68,56,.16);   --bad-bd:#912018;
    --post-text:#A5F0FC; --post-bg:rgba(8,138,178,.20); --post-bd:#0E7090;
    --dm-text:#D6B8FF;   --dm-bg:rgba(120,80,200,.20);  --dm-bd:#40306b;
    --create-bg:#F8FAFF; --create-text:#0B0C12;
    --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-sm:0 4px 16px rgba(0,0,0,.35);
    --ring:0 0 0 3px rgba(6,174,212,.35);
  }
}
/* --- DARK palette (explicit toggle) --- */
:root[data-theme="dark"] {
  --app:#0B0C12; --surface:#1B1D23; --surface-2:#1B1D23; --raise:#1B1D23;
  --hover:#292A31; --border:#292A31; --border-2:#43464F; --line:#292A31;
  --ink-0:#F8FAFF; --ink-1:#D4D6DF; --ink-2:#A4A7B3;
  --accent:#06AED4; --accent-deep:#67E3F9; --accent-text:#A5F0FC; --accent-soft:rgba(6,174,212,.16);
  --brand-solid:#088AB2; --brand-solid-hover:#06AED4; --on-brand-solid:#F8FAFF;
  --ink-on-accent-deep:#04222b;
  --good:#47CD89; --good-soft:rgba(23,178,106,.16); --good-bd:#085D3A;
  --warn:#FDB022; --warn-soft:rgba(247,144,9,.16); --warn-bd:#93370D;
  --bad:#F97066;  --bad-soft:rgba(240,68,56,.16);   --bad-bd:#912018;
  --post-text:#A5F0FC; --post-bg:rgba(8,138,178,.20); --post-bd:#0E7090;
  --dm-text:#D6B8FF;   --dm-bg:rgba(120,80,200,.20);  --dm-bd:#40306b;
  --create-bg:#F8FAFF; --create-text:#0B0C12;
  --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --ring:0 0 0 3px rgba(6,174,212,.35);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0;
  background: var(--app);
  color: var(--ink-0);
  font-family: var(--font-body);
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.ic-sm { width: 16px; height: 16px; }

/* ===================== SIDEBAR ===================== */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--side-w); z-index: 40;
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto;
}
.sidebar__inner { display: flex; flex-direction: column; min-height: 100%; padding: 18px 14px 90px; }
.sidebar__top { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
.brand { color: var(--ink-0); display: flex; align-items: center; }
.navtoggle {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-1); display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.navtoggle:hover { background: var(--hover); color: var(--ink-0); }
.navtoggle__chev { transition: transform .2s; }
.nav-collapsed .navtoggle__chev { transform: rotate(180deg); }
.iconrow { display: flex; gap: 6px; padding: 0 4px 14px; flex-wrap: wrap; }
.iconbtn {
  position: relative; width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-1);
  display: grid; place-items: center; transition: background .15s, color .15s, border-color .15s;
}
.iconbtn:hover { background: var(--hover); color: var(--ink-0); }
.iconbtn.is-active { background: var(--hover); color: var(--ink-0); border-color: var(--border-2); }
.iconbtn .badge {
  position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: #E8483C; color: #fff; font-size: 10px; font-weight: 700;
  display: grid; place-items: center;
}
.iconbtn--theme .ic-moon { display: none; }
:root[data-theme="dark"] .iconbtn--theme .ic-sun { display: none; }
:root[data-theme="dark"] .iconbtn--theme .ic-moon { display: block; }

.navgroup { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
.navgroup--smart { margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.navgroup__label {
  font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--ink-2); padding: 6px 10px;
}
.navitem {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 9px 10px; border-radius: 10px; border: none; background: transparent;
  color: var(--ink-1); font-size: 14.5px; font-weight: 500; text-align: left;
  transition: background .15s, color .15s;
}
.navitem span:not(.tag) { flex: 1; }
.navitem:hover { background: var(--hover); color: var(--ink-0); }
.navitem.is-active { background: var(--accent-soft); color: var(--accent-text); }
.navitem.is-active .ic { color: var(--accent-text); }
.tag {
  font-size: 10.5px; font-weight: 700; color: var(--accent-text);
  border: 1px solid var(--post-bd); background: var(--post-bg);
  padding: 2px 7px; border-radius: 999px;
}

.sidebar__foot {
  position: fixed; bottom: 0; left: 0; width: var(--side-w);
  display: flex; gap: 8px; align-items: center; padding: 12px 18px;
  background: var(--surface); border-right: 1px solid var(--border); border-top: 1px solid var(--line);
}
.userswitch {
  display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink-1);
}
.userswitch__avatar {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--hover); font-size: 16px;
}
.btn--create {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--create-bg); color: var(--create-text);
  border: none; border-radius: 12px; padding: 11px 14px; font-weight: 600; font-size: 14px;
}
.btn--create .ic { stroke: currentColor; }
.btn--create:hover { opacity: .92; }

.menubtn {
  position: fixed; top: 14px; left: 14px; z-index: 60;
  width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-0); font-size: 18px; box-shadow: var(--shadow-sm);
}
.sidebar__scrim { position: fixed; inset: 0; z-index: 39; background: rgba(10,20,25,.4); }

/* ===================== MAIN ===================== */
.main { margin-left: var(--side-w); margin-right: var(--copilot-w); min-height: 100vh; padding: 26px 30px 60px; transition: margin .2s ease; }
.copilot-off .main { margin-right: 0; }
.wrap { max-width: 1000px; margin: 0 auto; }

.mainhead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.mainhead__title { font-family: var(--font-display); font-weight: 600; font-size: 30px; letter-spacing: -.7px; margin: 0; }
.mainhead__sub { color: var(--ink-1); margin: 3px 0 0; }

/* range filter */
.rangefilter { position: relative; }
.rangefilter__btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border-2); color: var(--ink-0);
  border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px;
}
.rangefilter__btn:hover { background: var(--hover); }
.rangefilter__menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 170px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column;
}
.rangefilter__menu button {
  text-align: left; background: transparent; border: none; color: var(--ink-1);
  padding: 9px 11px; border-radius: 8px; font-size: 14px; font-weight: 500;
}
.rangefilter__menu button:hover { background: var(--hover); color: var(--ink-0); }
.rangefilter__menu button.is-active { color: var(--accent-text); font-weight: 600; }

/* ===================== STATS ===================== */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.stat__label { color: var(--ink-1); font-size: 13.5px; font-weight: 500; }
.stat__value { font-family: var(--font-display); font-weight: 600; font-size: 28px; margin-top: 8px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.stat__delta { font-size: 12.5px; font-weight: 600; margin-top: 4px; }
.stat__delta.up { color: var(--good); }
.stat__delta.down { color: var(--bad); }
.stat__delta.flat { color: var(--ink-2); }

/* ===================== TABS ===================== */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { background: transparent; border: none; color: var(--ink-1); font-weight: 500; font-size: 14.5px; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--ink-0); }
.tab.is-active { color: var(--accent-text); border-bottom-color: var(--accent); }

/* ===================== VIEWS ===================== */
.view { display: none; animation: fade .25s ease; }
.view.is-active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* OVERVIEW layout: Action items | Up next (wider) | What's new, on desktop */
.overview { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.notif .banner { margin-bottom: 14px; }
.notif .actionlist { margin-top: 0; }

/* action items */
.aitem { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
.aitem:first-child { border-top: none; padding-top: 2px; }
.aitem__icon { flex: 0 0 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; background: var(--accent-soft); }
.aitem__icon--warn { background: var(--warn-soft); }
.aitem__icon--bad { background: var(--bad-soft); }
.aitem__body { flex: 1; min-width: 0; }
.aitem__title { font-weight: 600; font-size: 13.5px; }
.aitem__desc { color: var(--ink-1); font-size: 12.5px; margin-top: 2px; }
.aitem__cta { flex-shrink: 0; align-self: center; }

/* reuse-top-DMs block */
.aitem--block { flex-direction: column; gap: 8px; }
.aitem__blockhead { display: flex; align-items: center; gap: 11px; width: 100%; }
.dmreuse { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.dmrow { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 9px; align-items: center; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; }
.dmrow__thumb { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; background: var(--hover); }
.dmrow__body { min-width: 0; }
.dmrow__text { font-size: 12.5px; color: var(--ink-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dmrow__meta { font-size: 11px; color: var(--ink-2); margin-top: 1px; }
.dmrow__conv { font-size: 12px; font-weight: 700; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.dmrow__btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface); color: var(--ink-1); display: grid; place-items: center; font-size: 15px; }
.dmrow__btn:hover { background: var(--hover); color: var(--accent-text); border-color: var(--post-bd); }

/* ===================== CARDS / GENERIC ===================== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card__title { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0; }
.card__sub { color: var(--ink-1); font-size: 13px; margin: 2px 0 0; }

.btn { border: 1px solid transparent; border-radius: 11px; padding: 9px 15px; font-weight: 600; font-size: 13.5px; transition: transform .08s, background .15s, border-color .15s, opacity .15s; }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--brand-solid); color: var(--on-brand-solid); }
.btn--primary:hover { background: var(--brand-solid-hover); }
.btn--ghost { background: var(--surface); border-color: var(--border-2); color: var(--ink-0); }
.btn--ghost:hover { background: var(--hover); }
.btn--sm { padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }
.btn--danger { background: transparent; border-color: var(--bad-bd); color: var(--bad); }
.btn--danger:hover { background: var(--bad-soft); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--hover); color: var(--ink-1); border: 1px solid var(--border); }
.pill--smart { background: var(--accent-soft); color: var(--accent-text); border-color: var(--post-bd); }
.pill--post { color: var(--post-text); border-color: var(--post-bd); background: var(--post-bg); }
.pill--dm { color: var(--dm-text); border-color: var(--dm-bd); background: var(--dm-bg); }
.pill--active { color: var(--good); border-color: var(--good-bd); background: var(--good-soft); }
.pill--paused { color: var(--warn); border-color: var(--warn-bd); background: var(--warn-soft); }

.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.right { margin-left: auto; }
.spacer { flex: 1; }
.stat__delta.up, .up { color: var(--good); }
.down { color: var(--bad); }
.flat { color: var(--ink-2); }

/* what's-new tips */
.actionlist { display: flex; flex-direction: column; gap: 10px; }
.action-tip { display: flex; gap: 12px; align-items: flex-start; background: var(--raise); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; }
.action-tip__icon { flex: 0 0 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; background: var(--accent-soft); color: var(--accent-text); }
.action-tip__title { font-weight: 600; font-size: 14px; }
.action-tip__desc { color: var(--ink-1); font-size: 13px; margin-top: 2px; }

/* ===================== LIVESTREAM BANNER ===================== */
.banner {
  position: relative; overflow: hidden; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #088AB2 0%, #0E7090 55%, #155B75 100%);
  min-height: 84px; color: #fff; box-shadow: var(--shadow-sm);
  display: flex; align-items: center;
}
.banner__glass { position: absolute; inset: 0; background: radial-gradient(90px 90px at 84% 40%, rgba(255,255,255,.18), transparent 70%); }
.banner__content { position: relative; z-index: 2; padding: 12px 14px; }
.banner__tag { display: inline-block; background: rgba(255,255,255,.22); color: #fff; font-size: 9.5px; font-weight: 700; letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
.banner__title { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.15; text-transform: uppercase; letter-spacing: .3px; max-width: 72%; text-shadow: 0 1px 8px rgba(0,0,0,.12); }
.banner__cam { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; color: rgba(255,255,255,.95); z-index: 2; }
.banner__c { position: absolute; border-radius: 50%; background: rgba(255,255,255,.10); z-index: 1; }
.banner__c1 { width: 80px; height: 80px; right: -16px; bottom: -30px; }
.banner__c2 { width: 42px; height: 42px; right: 44px; top: -18px; background: rgba(255,255,255,.08); }

/* ===================== QUEUE (scheduler) ===================== */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 3px; }
.seg button { background: transparent; border: none; color: var(--ink-1); padding: 7px 13px; border-radius: 8px; font-weight: 600; font-size: 13px; }
.seg button.is-active { background: var(--hover); color: var(--accent-text); }

.queue { display: flex; flex-direction: column; gap: 10px; }
.qitem { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: border-color .15s; }
.qitem:hover { border-color: var(--border-2); }
.qitem__when { text-align: center; }
.qitem__day { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.qitem__mon { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .5px; }
.qitem__time { font-size: 12.5px; color: var(--accent-text); margin-top: 2px; font-weight: 600; }
.qitem__body { min-width: 0; }
.qitem__meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
.qitem__text { color: var(--ink-0); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.qitem__sub { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; display: flex; align-items: center; gap: 8px; }

.qitem__actions { display: flex; gap: 6px; flex-shrink: 0; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 20px; border: 1px dashed var(--border-2); border-radius: var(--radius); }

/* ===================== AUTOMATIONS ===================== */
.autolist { display: flex; flex-direction: column; gap: 10px; }
.auto { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; box-shadow: var(--shadow-sm); transition: border-color .15s; }

.auto__name { font-weight: 600; font-size: 14.5px; }
.auto__trig { color: var(--ink-1); font-size: 12.5px; margin-top: 2px; }
.auto__stat { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.auto__right { display: flex; align-items: center; gap: 10px; }

.flow { display: flex; flex-direction: column; }
.flow__node { background: var(--raise); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; }
.flow__node--trigger { border-color: var(--post-bd); background: var(--post-bg); }
.flow__node--cond { border-color: var(--warn-bd); background: var(--warn-soft); }
.flow__nodetop { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.flow__kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-2); }
.flow__body { font-size: 13.5px; color: var(--ink-0); }
.flow__delay { color: var(--accent-text); font-size: 12px; font-weight: 600; }
.flow__connector { height: 20px; width: 2px; background: var(--border-2); margin: 0 auto; }
.flow__connector-label { text-align: center; margin: 4px auto; font-size: 11px; color: var(--ink-2); }

/* toggle switch */
.switch { position: relative; width: 40px; height: 22px; flex: 0 0 40px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch__track { position: absolute; inset: 0; border-radius: 999px; background: var(--border-2); transition: background .18s; }
.switch__track::before { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + .switch__track { background: var(--accent); }
.switch input:checked + .switch__track::before { transform: translateX(18px); }

/* ===================== COPILOT (docked right) ===================== */
.copilot {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--copilot-w); z-index: 45;
  display: flex; flex-direction: column; background: var(--surface);
  border-left: 1px solid var(--border);
}
.copilot-off .copilot { display: none; }

.copilot__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.copilot__id { display: flex; align-items: center; gap: 11px; }
.copilot__dot { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--pb-300), var(--pb-700)); display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 0 0 4px var(--accent-soft); }
.copilot__dot::after { content: "✦"; color: #04222b; font-size: 15px; }
.copilot__name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.copilot__status { font-size: 11.5px; color: var(--accent-text); }
.copilot__min { border: 1px solid var(--border); }

.chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; background: var(--app); }
.msg { display: flex; gap: 9px; max-width: 100%; animation: msgIn .22s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg__avatar { flex: 0 0 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; }
.msg--bot .msg__avatar { background: linear-gradient(135deg, var(--pb-300), var(--pb-700)); color: #04222b; }
.msg--user { flex-direction: row-reverse; }
.msg--user .msg__avatar { background: var(--hover); color: var(--ink-0); }
.msg__bubble { padding: 10px 13px; border-radius: 13px; font-size: 14px; line-height: 1.55; max-width: 300px; }
.msg--bot .msg__bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
.msg--user .msg__bubble { background: var(--accent-deep); color: var(--ink-on-accent-deep); border-top-right-radius: 4px; font-weight: 500; }
.msg__bubble p { margin: 0 0 7px; }
.msg__bubble p:last-child { margin-bottom: 0; }
.msg__bubble strong { color: inherit; font-weight: 700; }
.msg--bot .msg__bubble strong { color: var(--accent-text); }
.msg__bubble ul { margin: 6px 0; padding-left: 18px; }
.msg__bubble code { background: var(--hover); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }

.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

.actioncard { margin-top: 4px; background: var(--surface); border: 1px solid var(--post-bd); border-radius: 12px; overflow: hidden; }
.actioncard__head { padding: 9px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--accent-text); background: var(--accent-soft); border-bottom: 1px solid var(--post-bd); display: flex; align-items: center; gap: 6px; }
.actioncard__body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; gap: 8px; font-size: 13px; }
.kv__k { color: var(--ink-2); flex: 0 0 84px; }
.kv__v { color: var(--ink-0); font-weight: 500; }
.actioncard__foot { padding: 0 12px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.actioncard.is-done .actioncard__foot { display: none; }
.actioncard__done { padding: 10px 12px; color: var(--good); font-size: 12.5px; font-weight: 600; border-top: 1px solid var(--line); display: none; }
.actioncard.is-done .actioncard__done { display: block; }

.chat__suggest { display: flex; gap: 7px; padding: 10px 14px 4px; flex-wrap: wrap; border-top: 1px solid var(--line); background: var(--surface); }
.chip { background: var(--surface); border: 1px solid var(--border-2); color: var(--ink-1); padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; transition: background .15s, color .15s, border-color .15s; }
.chip:hover { background: var(--hover); color: var(--accent-text); border-color: var(--post-bd); }

.composer { display: flex; gap: 8px; padding: 12px 14px 14px; background: var(--surface); }
.composer__input { flex: 1; background: var(--app); border: 1px solid var(--border-2); color: var(--ink-0); border-radius: 12px; padding: 11px 14px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
.composer__input:focus { border-color: var(--accent); box-shadow: var(--ring); }

.composer__send { flex: 0 0 44px; height: 44px; border-radius: 12px; border: none; background: var(--brand-solid); color: var(--on-brand-solid); font-size: 18px; font-weight: 700; transition: background .15s, transform .08s; }
.composer__send:hover { background: var(--brand-solid-hover); }
.composer__send:active { transform: scale(.94); }

/* FAB */
.fab { position: fixed; right: 22px; bottom: 22px; z-index: 65; background: var(--brand-solid); color: var(--on-brand-solid); border: none; border-radius: 999px; padding: 14px 20px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; }
.fab:hover { background: var(--brand-solid-hover); }
.fab__spark { font-size: 16px; }

/* ===================== MODAL ===================== */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal__backdrop { position: absolute; inset: 0; background: rgba(15,25,30,.45); backdrop-filter: blur(3px); }
.modal__card { position: relative; z-index: 1; width: min(560px, 96vw); max-height: 90vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; }
.modal__title { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.modal__sub { color: var(--ink-1); margin: 0 0 18px; font-size: 13.5px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-1); margin-bottom: 6px; }
.field input, .field textarea, .field select { width: 100%; background: var(--surface); border: 1px solid var(--border-2); color: var(--ink-0); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: var(--ring); }
.field textarea { resize: vertical; min-height: 84px; }
.field .btn--ghost { margin-top: 8px; }
.modal__foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

/* media dropzone */
.dropzone { border: 1.5px dashed var(--border-2); border-radius: 12px; padding: 18px; text-align: center; color: var(--ink-1); background: var(--raise); cursor: pointer; transition: border-color .15s, background .15s; }
.dropzone:hover, .dropzone.is-drag { border-color: var(--accent); background: var(--accent-soft); }
.dropzone__ico { font-size: 22px; }
.dropzone__hint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.media-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.media-thumb { position: relative; width: 62px; height: 62px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--hover); display: grid; place-items: center; font-size: 22px; }
.media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
.media-thumb__rm { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; line-height: 1; display: grid; place-items: center; }
.media-thumb__name { position: absolute; bottom: 0; left: 0; right: 0; font-size: 8.5px; color: #fff; background: rgba(0,0,0,.5); padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===================== TOASTS ===================== */
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--surface); border: 1px solid var(--post-bd); color: var(--ink-0); padding: 11px 16px; border-radius: 11px; font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow); animation: toastIn .25s ease; display: flex; align-items: center; gap: 8px; }
.toast__ico { color: var(--accent-text); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ===================== COLLAPSED NAV (desktop) ===================== */
@media (min-width: 861px) {
  .nav-collapsed .sidebar,
  .nav-collapsed .sidebar__foot { width: var(--side-w-collapsed); }
  .nav-collapsed .main { margin-left: var(--side-w-collapsed); }

  .nav-collapsed .btn__label,
  .nav-collapsed .userswitch .ic-sm { display: none; }
  .nav-collapsed .navitem { justify-content: center; padding-left: 0; padding-right: 0; }
  .nav-collapsed .iconrow { flex-direction: column; align-items: center; padding-left: 0; padding-right: 0; }
  .nav-collapsed .navgroup { align-items: center; }
  .nav-collapsed .navgroup--smart { width: 100%; }
  .nav-collapsed .btn--create { padding-left: 0; padding-right: 0; gap: 0; }
  .nav-collapsed .sidebar__foot { padding: 12px 0; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .nav-collapsed .userswitch { padding: 4px; }
}

/* ===================== RESPONSIVE ===================== */
/* Below this width the copilot stops pushing content and floats as an overlay. */
@media (max-width: 1200px) {
  .main { margin-right: 0; }
  .copilot { box-shadow: var(--shadow); }
}
@media (max-width: 1240px) {
  .overview { grid-template-columns: 1fr; }
}
@media (max-width: 1040px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); transition: transform .25s ease; }
  .sidebar.is-open { transform: none; }
  .sidebar__foot { transform: translateX(-100%); transition: transform .25s ease; }
  .sidebar.is-open .sidebar__foot { transform: none; }
  .main { margin-left: 0; padding: 70px 18px 60px; }
  .menubtn { display: grid; place-items: center; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mainhead__title { font-size: 24px; }
  .qitem { grid-template-columns: 64px 1fr; }
  .qitem__actions { grid-column: 1 / -1; justify-content: flex-end; }
  .copilot { width: min(400px, 100vw); }
  .fab { right: 14px; bottom: 14px; }
}

     engagement[dayIndex][hour] = 0..100 relative activity.
     Built with a deterministic model so "best times" are stable:
     weekday evenings (7-10pm) + lunch (12-1pm) peak, weekends shift later.
  --------------------------------------------------------- */
  function buildEngagement() {
    var grid = [];
    for (var d = 0; d < 7; d++) {
      var row = [];
      var weekend = d === 0 || d === 6;
      for (var h = 0; h < 24; h++) {
        var v = 6; // baseline
        // morning bump
        v += bump(h, weekend ? 10 : 8, 2, weekend ? 22 : 26);
        // lunch bump (weekdays stronger)
        v += bump(h, 12.5, 1.4, weekend ? 20 : 40);
        // evening prime time
        v += bump(h, weekend ? 21.5 : 20.5, 2.2, weekend ? 78 : 92);
        // late night tail
        v += bump(h, 24.5, 2.5, 30);
        // slight per-day variance (deterministic)
        v *= 0.9 + 0.03 * ((d * 7 + 3) % 6);
        row.push(Math.max(2, Math.min(100, Math.round(v))));
      }
      grid.push(row);
    }
    return grid;
