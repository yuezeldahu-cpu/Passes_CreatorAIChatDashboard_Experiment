<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>passes · creator copilot</title>
  <meta name="description" content="Passes creator dashboard with an AI copilot that schedules content smartly and builds automated messages." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <script>
    // set theme + nav state before paint to avoid a flash
    // (defaults: light theme to match the product, side nav folded)
    (function () {
      var theme = "light", nav = "collapsed";
      try { theme = localStorage.getItem("passes-theme") || "light"; } catch (e) {}
      try { nav = localStorage.getItem("passes-nav") || "collapsed"; } catch (e) {}
      var r = document.documentElement;
      r.setAttribute("data-theme", theme);
      if (nav === "collapsed") r.classList.add("nav-collapsed");
    })();
  </script>

  <!-- ========== LEFT SIDEBAR (foldable) ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__inner">
      <div class="sidebar__top">
        <a class="brand" href="#" aria-label="passes home">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <rect x="14" y="4" width="14" height="14" rx="4" fill="currentColor"/>
            <circle cx="8" cy="24" r="4" fill="currentColor"/>
          </svg>
        </a>
        <button class="navtoggle" id="navToggle" aria-label="Expand menu" title="Expand / collapse menu">
          <svg viewBox="0 0 24 24" class="ic ic-sm navtoggle__chev"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <div class="iconrow">
        <button class="iconbtn is-active" data-view="overview" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 11l8-6 8 6M6 10v9h12v-9"/></svg>
        </button>
        <button class="iconbtn" data-soon="Messages" title="Messages" aria-label="Messages">
          <svg viewBox="0 0 24 24" class="ic"><path d="M5 5h14v10H9l-4 4z"/></svg>
          <span class="badge">2</span>
        </button>
        <button class="iconbtn" data-soon="Notifications" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" class="ic"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>
        </button>
        <button class="iconbtn" data-soon="Storefront" title="Storefront" aria-label="Storefront">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 9l1-4h14l1 4M4 9h16v10H4zM4 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
        </button>
        <button class="iconbtn" data-soon="Settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
        </button>
        <button class="iconbtn iconbtn--theme" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" class="ic ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg viewBox="0 0 24 24" class="ic ic-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>

      <nav class="navgroup" aria-label="Creator tools">
        <div class="navgroup__label">Creator Tools</div>
        <button class="navitem" data-soon="Vault">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 16V9m0 0l-3 3m3-3l3 3M6 19a5 5 0 0 1-1-9.9A6 6 0 0 1 17 8a4 4 0 0 1 1 7.9"/></svg>
          <span>Vault</span>
        </button>
        <button class="navitem" data-soon="Lists">
          <svg viewBox="0 0 24 24" class="ic"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>Lists</span>
        </button>
        <button class="navitem" data-view="scheduler">
          <svg viewBox="0 0 24 24" class="ic"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M12 12v5M9.5 14.5h5"/></svg>
          <span>Scheduler</span>
        </button>
        <button class="navitem" data-soon="Livestream">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M6 6a8 8 0 0 0 0 12M18 6a8 8 0 0 1 0 12"/></svg>
          <span>Start Livestream</span>
          <span class="tag">Updated</span>
        </button>
        <button class="navitem" data-soon="Post Categories">
          <svg viewBox="0 0 24 24" class="ic"><path d="M9 4L5 11h8zM17.5 15a3.5 3.5 0 1 0 0 .01M4 14h6v6H4z"/></svg>
          <span>Post Categories</span>
        </button>
        <button class="navitem" data-soon="Manage Memberships">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 6a3 3 0 0 1 0 6M18 14a6 6 0 0 1 3 6"/></svg>
          <span>Manage Memberships</span>
        </button>
        <button class="navitem" data-soon="Integrations">
          <svg viewBox="0 0 24 24" class="ic"><path d="M10 4h4v3a2 2 0 0 0 4 0V4h2v6h-3a2 2 0 0 0 0 4h3v6h-6v-3a2 2 0 0 0-4 0v3H4v-6h3a2 2 0 0 0 0-4H4V4z"/></svg>
          <span>Integrations</span>
        </button>
      </nav>

      <div class="navgroup navgroup--smart" aria-label="Smart tools">
        <div class="navgroup__label">Smart Tools</div>
        <button class="navitem" data-view="scheduler">
          <svg viewBox="0 0 24 24" class="ic"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/><path d="M15 13l.7 1.6L17.3 15l-1.6.7L15 17.3l-.7-1.6L12.7 15l1.6-.7z" fill="currentColor" stroke="none"/></svg>
          <span>Smart Scheduler</span>
        </button>
        <button class="navitem" data-view="automations">
          <svg viewBox="0 0 24 24" class="ic"><rect x="4" y="6" width="16" height="11" rx="2"/><path d="M8 17l-2 3M9 11h.01M15 11h.01M12 3v3"/></svg>
          <span>Automated Messages</span>
        </button>
      </div>

      <div class="sidebar__foot">
        <button class="userswitch" data-soon="Switch account">
          <span class="userswitch__avatar">🐵</span>
          <svg viewBox="0 0 24 24" class="ic ic-sm"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
        </button>
        <button class="btn btn--create" data-soon="Create" title="Create">
          <svg viewBox="0 0 24 24" class="ic ic-sm"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn__label">Create</span>
        </button>
      </div>
    </div>
  </aside>

  <button class="menubtn" id="menuBtn" aria-label="Open menu" hidden>☰</button>
  <div class="sidebar__scrim" id="sidebarScrim" hidden></div>

  <!-- ========== MAIN ========== -->
  <main class="main" id="main">
    <div class="wrap">
      <header class="mainhead">
        <div><h1 class="mainhead__title">Welcome back, Ava!</h1></div>
        <div id="rangeHost"></div>
      </header>

      <section class="stats" id="statsRow" aria-label="Key metrics"></section>

      <nav class="tabs" role="tablist" aria-label="Dashboard sections">
        <button class="tab is-active" role="tab" data-view="overview">Overview</button>
        <button class="tab" role="tab" data-view="scheduler">Smart Scheduler</button>
        <button class="tab" role="tab" data-view="automations">Automated Messages</button>
      </nav>

      <!-- OVERVIEW -->
      <section class="view is-active" data-view="overview" id="view-overview">
        <div class="overview">
          <div class="card notif">
            <div class="card__head"><h3 class="card__title">What's new for you</h3></div>
            <div class="banner" role="img" aria-label="New livestream experience">
              <div class="banner__glass"></div>
              <div class="banner__content">
                <span class="banner__tag">NEW</span>
                <div class="banner__title">Your new<br/>livestream<br/>experience</div>
              </div>
              <svg class="banner__cam" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="12" height="10" rx="2" fill="currentColor"/><path d="M15 10l6-3v10l-6-3z" fill="currentColor"/></svg>
              <span class="banner__c banner__c1"></span>
              <span class="banner__c banner__c2"></span>
              <span class="banner__c banner__c3"></span>
            </div>
            <div id="tipsList" class="actionlist"></div>
          </div>
          <div class="card" id="upNextCard"></div>
        </div>
      </section>

      <!-- SMART SCHEDULER -->
      <section class="view" data-view="scheduler" id="view-scheduler"></section>

      <!-- AUTOMATED MESSAGES -->
      <section class="view" data-view="automations" id="view-automations"></section>
    </div>
  </main>

  <!-- ========== COPILOT (docked right) ========== -->
  <aside class="copilot" id="copilot" aria-label="AI copilot">
    <div class="copilot__head">
      <div class="copilot__id">
        <span class="copilot__dot" aria-hidden="true"></span>
        <div>
          <div class="copilot__name">Copilot</div>
          <div class="copilot__status">Schedule posts &amp; DMs, on autopilot</div>
        </div>
      </div>
      <button class="iconbtn copilot__min" id="copilotMin" aria-label="Collapse copilot" title="Collapse">×</button>
    </div>
    <div class="chat" id="chatLog" aria-live="polite"></div>
    <div class="chat__suggest" id="chatSuggest"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input class="composer__input" id="chatInput" type="text"
             placeholder="Try: schedule a post tomorrow at the best time" aria-label="Message your copilot" />
      <button class="composer__send" type="submit" aria-label="Send">↑</button>
    </form>
  </aside>

  <button class="fab" id="copilotFab" hidden aria-label="Open copilot">
    <span class="fab__spark" aria-hidden="true">✦</span>
    <span class="fab__label">Copilot</span>
  </button>

  <!-- MODAL HOST -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalCard"></div>
  </div>

  <!-- TOASTS -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/automations.js"></script>
  <script src="js/nlu.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
